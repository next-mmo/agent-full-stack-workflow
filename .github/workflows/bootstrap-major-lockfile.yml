name: Bootstrap coordinated major lockfile

on:
  push:
    branches: [chore/coordinated-major-deps]
    paths:
      - apps/api/package.json
      - apps/web/package.json
      - .github/workflows/bootstrap-major-lockfile.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: chore/coordinated-major-deps

      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate combined lockfile
        run: pnpm install --lockfile-only

      - name: Commit generated lockfile
        shell: bash
        run: |
          test -f pnpm-lock.yaml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo "Lockfile already current."
            exit 0
          fi
          git commit -m "chore: generate coordinated major lockfile"
          git push origin HEAD:chore/coordinated-major-deps
