name: Codex Managed Review Trigger

# IMPORTANT SECURITY NOTE:
# This uses pull_request_target only to post a comment that triggers the
# already-installed Codex GitHub App. It MUST NOT checkout, build, test,
# source, or otherwise execute code from the pull request head.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: codex-managed-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-codex-review:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger managed Codex review once per PR head
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = context.payload.pull_request.number
            const headSha = context.payload.pull_request.head.sha
            const marker = `<!-- codex-managed-review:${headSha} -->`

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            )

            if (comments.some((comment) => comment.body?.includes(marker))) {
              core.info(`Codex review already requested for ${headSha}`)
              return
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `@codex review\n\n${marker}`,
            })

            core.info(`Requested managed Codex review for ${headSha}`)
