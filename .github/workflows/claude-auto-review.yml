name: Claude Auto Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'claude[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write

    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Check Claude review authentication
        id: auth
        shell: bash
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "method=api-key" >> "$GITHUB_OUTPUT"
          elif [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "method=oauth" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::notice::Claude Auto Review is installed but inactive. Configure either CLAUDE_CODE_OAUTH_TOKEN (no API key) or ANTHROPIC_API_KEY. Enterprise teams can replace static credentials with Anthropic Workload Identity Federation."
          fi

      - name: Checkout repository
        if: steps.auth.outputs.configured == 'true'
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Review pull request with Claude
        if: steps.auth.outputs.configured == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ steps.auth.outputs.method == 'api-key' && secrets.ANTHROPIC_API_KEY || '' }}
          claude_code_oauth_token: ${{ steps.auth.outputs.method == 'oauth' && secrets.CLAUDE_CODE_OAUTH_TOKEN || '' }}
          track_progress: true
          prompt: |
            REPOSITORY: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the automated company code reviewer for this repository.
            This is an advisory review only. Never approve, merge, or modify the PR.
            Human approval remains mandatory.

            First read the repository instructions that apply to the changed files:
            - AGENTS.md
            - CLAUDE.md
            - the nearest scoped AGENTS.md / CLAUDE.md
            - relevant docs/plans/ artifacts when the PR references or contains one
            - docs/AI_REVIEW_POLICY.md

            Review the PR diff against its stated intent and repository rules.

            Focus on actionable defects, not style preference:
            1. correctness and regressions
            2. security, authentication, authorization, secrets, and sensitive data
            3. API contracts and frontend/backend integration
            4. database migrations, data integrity, rollback safety, and query bounds
            5. concurrency, error handling, and edge cases
            6. test quality and missing verification
            7. maintainability only where it creates concrete engineering risk

            Severity:
            - P0: critical security/data-loss/production blocker
            - P1: correctness or security issue that should block merge
            - P2: meaningful improvement or missing coverage that should be addressed or consciously accepted

            For each finding include:
            - severity
            - exact file/line when possible
            - why it matters
            - smallest practical fix

            Use inline comments for specific code findings.
            Use one top-level PR comment for the final summary.
            Do not produce praise-only comments and do not repeat the same issue.

            In the final summary include:
            - finding counts by severity
            - whether migration/security/API-contract areas changed
            - test/CI evidence visible at review time
            - remaining human-review focus

            End with exactly:
            "Automated Claude review is advisory. Human approval is required before merge."
          claude_args: |
            --max-turns 20
            --allowedTools "Read,Glob,Grep,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr checks:*),Bash(gh pr comment:*)"
