name: Codex Managed Re-review Trigger

# Codex managed review is already configured for this repository to review
# newly opened / ready PRs without a repository OPENAI_API_KEY.
#
# This workflow only fills the update gap by asking Codex to re-review when
# new commits are pushed or a PR is reopened.
#
# SECURITY: pull_request_target is used only to post a metadata comment.
# Never checkout, build, install, source, or execute pull-request head code here.
on:
  pull_request_target:
    types: [synchronize, reopened]

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: codex-managed-rereview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-codex-rereview:
    if: >-
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login != 'chatgpt-codex-connector[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger managed Codex review once per PR head
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner
            const repo = context.repo.repo
            const issue_number = context.payload.pull_request.number
            const headSha = context.payload.pull_request.head.sha
            const marker = `<!-- codex-managed-review:${headSha} -->`

            const comments = await github.paginate(
              github.rest.issues.listComments,
              { owner, repo, issue_number, per_page: 100 },
            )

            if (comments.some((comment) => comment.body?.includes(marker))) {
              core.info(`Codex review already requested for ${headSha}`)
              return
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: `@codex review\n\n${marker}`,
            })

            core.info(`Requested managed Codex re-review for ${headSha}`)
