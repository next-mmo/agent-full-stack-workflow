name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://app:app@localhost:5432/app?schema=public
      API_PORT: 3000
      WEB_ORIGIN: http://localhost:5173
      VITE_API_URL: http://localhost:3000/api

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # This starter intentionally bootstraps without a generated lockfile.
      # First developer install should commit pnpm-lock.yaml, after which CI
      # should switch to --frozen-lockfile and re-enable setup-node pnpm cache.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Apply migrations
        run: pnpm --dir apps/api prisma migrate deploy

      - name: Lint API
        run: pnpm --dir apps/api lint

      - name: Lint web
        run: pnpm --dir apps/web lint

      - name: Test API
        run: pnpm --dir apps/api test

      - name: Test web
        run: pnpm --dir apps/web test

      - name: Build API
        run: pnpm --dir apps/api build

      - name: Build web
        run: pnpm --dir apps/web build

      - name: API e2e
        run: pnpm --dir apps/api test:e2e
